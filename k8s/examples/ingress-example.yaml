# Exemple documenté (non déployé dans cette démonstration) de la façon dont
# on exposerait publiquement le service via un Ingress + AWS Load Balancer
# Controller, plutôt qu'un Service ClusterIP interne (voir k8s/base/service.yaml).
#
# Non déployé ici pour deux raisons :
# 1. Coût : un Application Load Balancer facturé en continu n'a pas de sens
#    pour une démonstration de quelques heures.
# 2. Complexité : l'AWS Load Balancer Controller nécessite son propre rôle
#    IAM (IRSA) et son installation via Helm — une étape supplémentaire
#    légitime en production, mais hors du périmètre choisi pour ce test.
#
# Pour l'utiliser réellement : installer le controller
# (https://kubernetes-sigs.github.io/aws-load-balancer-controller/), puis :
#   kubectl apply -f k8s/examples/ingress-example.yaml

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-service
  namespace: devsecops-demo
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # HTTPS uniquement : toute requête HTTP est redirigée, jamais servie en clair.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:eu-west-3:<compte>:certificate/<id>"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-service
                port:
                  number: 80
