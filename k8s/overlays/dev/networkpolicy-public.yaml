# Autorise en plus le trafic venant de l'extérieur du cluster (le LoadBalancer
# public) à atteindre l'application, sur le port applicatif uniquement.
# Spécifique à l'overlay dev (démo) : l'overlay de base reste strictement
# interne (voir k8s/base/networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-service-allow-public
spec:
  podSelector:
    matchLabels:
      app: demo-service
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8000
