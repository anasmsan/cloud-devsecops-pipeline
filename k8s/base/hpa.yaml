# Autoscaling horizontal : ajoute/enlève automatiquement des répliques du pod
# selon la charge CPU réelle, plutôt qu'un nombre de répliques fixe décidé à
# l'avance. Nécessite que metrics-server tourne sur le cluster (voir
# scripts/install_cluster_addons.sh).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: demo-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: demo-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
