apiVersion: v1
kind: Service
metadata:
  name: demo-service
spec:
  # ClusterIP (pas LoadBalancer) : le service n'est joignable que depuis
  # l'intérieur du cluster. L'exposer publiquement se ferait via un Ingress +
  # AWS Load Balancer Controller (voir README, non déployé ici pour limiter
  # le coût et la durée de vie de la démonstration).
  type: ClusterIP
  selector:
    app: demo-service
  ports:
    - name: http
      port: 80
      targetPort: 8000
